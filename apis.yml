name: Artivest
description: 'Artivest was a New York-based alternative investments technology company founded in 2012
  that gave financial advisors and high-net-worth investors a curated digital experience for discovering,
  evaluating, and subscribing to private investment funds, including its "Open Network" platform serving
  roughly 1,800 advisors and management of 28 proprietary alternative investment funds. iCapital Network
  announced the acquisition of substantially all of Artivest''s assets — technology, operating platform,
  fund management, and enterprise relationships — on 2020-05-13 and closed the transaction in August
  2020. The Artivest brand, platform, and public web presence were fully absorbed into iCapital; as of
  this enrichment pass artivest.co does not resolve and artivest.com is registered to an unrelated third
  party. Artivest never published a public developer portal, API documentation, or machine-readable API
  artifacts, and there is no live surface remaining to enrich.'
